name: Build all targets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-all-targets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  quality-and-web:
    name: Quality checks and Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and LFS data
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          lfs: true

      - name: Install Flutter stable
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build and exercise Web release
        run: bash tool/test_web_offline_audio.sh

      - name: Upload Web release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ansagengenerator-web
          path: build/web/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  android:
    name: Android APK
    needs: quality-and-web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and LFS data
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          lfs: true

      - name: Install JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Flutter stable
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK signature
        shell: bash
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ansagengenerator-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  linux:
    name: Linux x64 bundle
    needs: quality-and-web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and LFS data
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          lfs: true

      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libjson-glib-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            xvfb \
            xauth

      - name: Install Flutter stable
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Fetch verified FFmpegKit Audio runtime
        run: |
          set -euo pipefail
          url='https://github.com/sk3llo/ffmpeg_kit_flutter/releases/download/8.1.2-audio/ffmpeg-kit-linux-x86_64-audio-8.1.2.tar.gz'
          expected_sha256='6b01c49cf90d19193317cba84752f2b76150fa4c49b387dbd7f2f237c57b3cfb'
          runtime_root="$RUNNER_TEMP/ffmpeg-kit-audio-8.1.2"
          archive="$RUNNER_TEMP/ffmpeg-kit-linux-x86_64-audio-8.1.2.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 -o "$archive" "$url"
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check --status
          mkdir -p "$runtime_root"
          tar -xzf "$archive" -C "$runtime_root"
          test -f "$runtime_root/ffmpeg-kit/lib/libffmpegkit.so"
          printf 'FFMPEGKIT_LOCAL_DIR=%s\n' "$runtime_root/ffmpeg-kit" >> "$GITHUB_ENV"

      - name: Build Linux x64 bundle
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Add third-party notices to Linux bundle
        run: cp THIRD_PARTY_NOTICES.md build/linux/x64/release/bundle/

      - name: Upload Linux x64 bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ansagengenerator-linux-x64
          path: build/linux/x64/release/bundle/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  windows:
    name: Windows x64 distribution
    needs: quality-and-web
    runs-on: windows-latest

    steps:
      - name: Checkout source and LFS data
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          lfs: true

      - name: Install Flutter stable
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        shell: pwsh
        run: flutter pub get

      - name: Fetch verified FFmpegKit Audio runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/sk3llo/ffmpeg_kit_flutter/releases/download/8.1.2-audio/ffmpeg-kit-windows-x86_64-audio-8.1.2.zip'
          $expectedSha256 = 'dcd9eabb067a3ef34ae8e7c1d01bf06592714978496e3b03c9015d2dc21ea94d'
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'ffmpeg-kit-audio-8.1.2'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-kit-windows-x86_64-audio-8.1.2.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "FFmpegKit SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtimeRoot -Force
          if (-not (Test-Path (Join-Path $runtimeRoot 'bin/libffmpegkit.dll'))) {
            throw 'FFmpegKit bundle does not contain bin/libffmpegkit.dll'
          }
          "FFMPEGKIT_LOCAL_DIR=$runtimeRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Windows offline Opus conversion and WAV export
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter drive `
            --driver=test_driver/integration_test.dart `
            --target=integration_test/native_offline_audio_library_integration_test.dart `
            -d windows

      - name: Build Windows x64 release
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Add third-party notices to Windows distribution
        shell: pwsh
        run: Copy-Item THIRD_PARTY_NOTICES.md build/windows/x64/runner/Release/THIRD_PARTY_NOTICES.md

      - name: Upload complete Windows distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ansagengenerator-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  apple:
    name: macOS and unsigned iOS
    needs: quality-and-web
    # macos-latest follows GitHub's currently supported hosted macOS image.
    runs-on: macos-latest

    steps:
      - name: Checkout source and LFS data
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          lfs: true

      - name: Install Flutter stable
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build macOS application release
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign

      - name: Add third-party notices to Apple bundles
        run: |
          cp THIRD_PARTY_NOTICES.md build/macos/Build/Products/Release/*.app/Contents/Resources/
          cp THIRD_PARTY_NOTICES.md build/ios/iphoneos/Runner.app/

      - name: Upload macOS application bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ansagengenerator-macos-app
          path: build/macos/Build/Products/Release/*.app
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload unsigned iOS application bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ansagengenerator-ios-unsigned
          path: build/ios/iphoneos/Runner.app/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
